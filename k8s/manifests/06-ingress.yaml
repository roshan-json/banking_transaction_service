apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-transaction-ingress
  namespace: banking-transaction
  labels:
    app: banking-transaction-service
spec:
  ingressClassName: nginx
  rules:
  - host: banking-transaction.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: banking-transaction-service
            port:
              number: 80
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: banking-transaction-service
            port:
              number: 80
