apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-transaction-sa
  namespace: banking-transaction
  labels:
    app: banking-transaction-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-transaction-role
  namespace: banking-transaction
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-transaction-rolebinding
  namespace: banking-transaction
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-transaction-role
subjects:
- kind: ServiceAccount
  name: banking-transaction-sa
  namespace: banking-transaction
