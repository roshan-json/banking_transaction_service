apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-transaction-netpolicy
  namespace: banking-transaction
spec:
  podSelector:
    matchLabels:
      app: banking-transaction-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: banking-transaction
    - podSelector:
        matchLabels:
          app: banking-transaction-service
    - namespaceSelector:
        matchLabels:
          ingress-nginx: enabled
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
