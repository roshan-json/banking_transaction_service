apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: banking-transaction-service-monitor
  namespace: banking-transaction
  labels:
    app: banking-transaction-service
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: banking-transaction-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
